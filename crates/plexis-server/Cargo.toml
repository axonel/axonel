[package]
name = "plexis-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "API-first HTTP server and operational control interface for Plexis"

[dependencies]
plexis-core.workspace = true
plexis-storage.workspace = true
plexis-runtime.workspace = true
plexis-planner.workspace = true
plexis-tools.workspace = true
plexis-providers.workspace = true
plexis-memory.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-stream.workspace = true
tower-http = { workspace = true, features = ["trace", "cors", "fs"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
clap = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }

[[bin]]
name = "plexis-server"
path = "src/main.rs"

[[bin]]
name = "sentinel"
path = "src/bin/sentinel.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.12"

