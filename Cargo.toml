[workspace]
resolver = "2"
members = [
    "crates/plexis-core",
    "crates/plexis-storage",
    "crates/plexis-providers",
    "crates/plexis-tools",
    "crates/plexis-runtime",
    "crates/plexis-server",
    "crates/plexis-planner",
    "crates/plexis-memory",
    "crates/plexis-fake-agent",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
authors = ["Plexis Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/axonel/sentinel"

[workspace.dependencies]
plexis-core = { path = "crates/plexis-core" }
plexis-storage = { path = "crates/plexis-storage" }
plexis-providers = { path = "crates/plexis-providers" }
plexis-tools = { path = "crates/plexis-tools" }
plexis-runtime = { path = "crates/plexis-runtime" }
plexis-planner = { path = "crates/plexis-planner" }
plexis-memory = { path = "crates/plexis-memory" }

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Identifiers & Time
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# Utilities & Error Handling
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
